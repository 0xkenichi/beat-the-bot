# Every 15 minutes: indexer (prices, locks, deposits, hourly snapshots), opening prices at the US open,
# scoring at the US close, signed-lock relays and the timed Telegram posts. Holds the resolver key only.
name: tick
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency: { group: tick, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      RESOLVER_PRIVATE_KEY: ${{ secrets.RESOLVER_PRIVATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @btb/scoring tick
