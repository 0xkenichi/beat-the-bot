# Pays a week's prizes. Weeks 1-2: run by hand after Kenichi checks the winners are different people.
name: settle
on:
  workflow_dispatch:
    inputs:
      week: { description: "Week number", required: true }
      approved: { description: "I checked the winners are different people (weeks 1-2)", type: boolean, default: false }
permissions:
  contents: read
jobs:
  settle:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      RESOLVER_PRIVATE_KEY: ${{ secrets.RESOLVER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @btb/scoring exec tsx src/cli.ts settle --week ${{ inputs.week }} ${{ inputs.approved && '--approved' || '' }}
