# Manual only for now: GitHub Actions cannot start jobs on this account (billing lock, 1 Nov 2026), and every push
# was reported as a failure without running a step. Once billing is cleared, restore the automatic trigger:
#   on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
# The same steps pass locally: pnpm install --frozen-lockfile, forge test, pnpm test, typecheck, web build.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: cd contracts && forge build && forge test
      - run: pnpm --filter @btb/shared --filter @btb/bots --filter @btb/scoring --filter @btb/indexer test
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @btb/web build
